version: "2"

sql:
  - engine: postgresql
    queries: db/queries
    # PostgreSQL migrations are the single source of truth for sqlc types.
    schema: ../supabase/migrations
    gen:
      go:
        package: sqlc
        out: db/sqlc
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
